<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abendessen-Planer</title>
<style>
  :root{
    --accent:#0f766e;
    --accent-dark:#0b5a54;
    --accent-light:#ccfbf1;
    --accent-lighter:#f0fdfa;
    --text:#1f2937;
    --text-muted:#6b7280;
    --text-faint:#9ca3af;
    --bg:#f7f8f7;
    --card-bg:#ffffff;
    --border:#e7e9e8;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 3px rgba(15,23,42,0.06), 0 4px 14px rgba(15,23,42,0.05);
    --shadow-sheet:0 -4px 24px rgba(15,23,42,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}

  /* ---------- App shell: fixed-height frame, only the active panel scrolls ---------- */
  .app-shell{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  .app-header{
    flex-shrink:0; z-index:20;
    background:rgba(247,248,247,0.92);
    backdrop-filter:blur(8px);
    padding:4px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .app-logo-wrap{display:flex; align-items:center; min-width:0;}
  .app-logo{height:54px; width:auto; display:block;}
  .icon-btn{
    border:none; background:none; cursor:pointer;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(15,118,110,0.12);}
  .icon-btn img{width:30px; height:30px;}
  .icon-btn.disabled{opacity:.35; pointer-events:none;}
  .icon-btn.list-active{background:rgba(15,118,110,0.14);}

  .header-actions{display:flex; align-items:center; gap:10px;}
  .portion-stepper{
    display:flex; align-items:center; gap:5px;
    background:var(--accent-lighter);
    border-radius:999px; padding:3px 4px 3px 8px;
    flex-shrink:0;
  }
  .portion-stepper .portion-icon{width:14px; height:14px; color:var(--accent-dark); flex-shrink:0;}
  .portion-stepper .portion-value{
    font-size:12.5px; font-weight:800; color:var(--accent-dark);
    min-width:14px; text-align:center;
  }
  .portion-stepper button{
    width:22px; height:22px; border-radius:50%; border:none;
    background:#fff; color:var(--accent-dark); font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; line-height:1;
    box-shadow:0 1px 2px rgba(15,23,42,0.08);
  }
  .portion-stepper button:active{background:var(--accent-light);}
  .portion-stepper button:disabled{opacity:.3; pointer-events:none;}
  #header-portion-stepper{padding:3px 6px 3px 10px;}
  #header-portion-stepper .portion-value{font-size:13.5px;}
  #sheet-portion-stepper{padding:3px 6px 3px 10px;}
  #sheet-portion-stepper .portion-value{font-size:13.5px;}

  /* ---------- Layout ---------- */
  .view{max-width:1240px; margin:0 auto; padding:14px 14px 24px;}
  .hidden{display:none !important;}

  .day-grid{
    display:flex; flex-direction:column; gap:14px;
  }
  @media(min-width:720px){
    .day-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
      gap:16px;
    }
  }
  @media(min-width:720px){
    .shop-groups-wrap, #shopping-groups{max-width:640px; margin:0 auto;}
  }

  /* ---------- Day card (compact horizontal, image left -> fades to white) ---------- */
  .day-card{
    display:flex;
    align-items:stretch;
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
    min-height:132px;
    transition:background-color .15s ease;
  }
  .day-card.selected{
    background:#dbeae9;
  }
  .card-img-wrap, .card-content{cursor:pointer;}
  .card-img-wrap{
    position:relative; width:38%; flex-shrink:0; overflow:hidden; background:#eee;
  }
  .card-img-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-img-fade{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to right, rgba(255,255,255,0) 45%, rgba(255,255,255,0.55) 72%, #fff 100%);
  }
  .day-card.selected .card-img-fade{
    background:linear-gradient(to right, rgba(219,234,233,0) 45%, rgba(219,234,233,0.55) 72%, #dbeae9 100%);
  }
  .day-badge{
    position:absolute; top:8px; left:8px; z-index:2;
    background:rgba(15,23,42,0.62);
    color:#fff; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:999px;
    letter-spacing:.02em;
  }

  .card-content{
    flex:1; min-width:0;
    display:flex; flex-direction:column; justify-content:flex-start;
    gap:7px;
    padding:14px 14px 14px 4px;
  }
  .dish-name{
    font-size:18px; font-weight:700; margin:0; line-height:1.26;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:calc(18px * 1.26 * 2);
  }
  .dish-meta{font-size:14px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dish-meta-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .dish-meta-row .dish-meta{flex:1; min-width:0;}
  .dish-meta-row .portion-stepper{flex-shrink:0;}

  .macro-row{
    display:flex; gap:5px; flex-wrap:wrap;
  }
  .macro-chip{
    background:var(--accent-lighter);
    color:var(--accent-dark);
    font-size:12.5px; font-weight:700;
    padding:4px 9px; border-radius:999px;
    display:flex; align-items:center; gap:3px;
    white-space:nowrap;
  }
  .macro-chip .val{font-weight:800;}
  .macro-chip .lbl{font-weight:500; color:var(--accent);}

  .action-row{
    display:flex; align-items:stretch; gap:6px; margin-top:6px;
  }
  .action-btn{
    flex:1; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; border:none; background:none; cursor:pointer;
    padding:8px 4px; border-radius:16px;
    transition:none;
  }
  .action-btn:active{background:rgba(15,118,110,0.10);}
  .action-btn img{width:30px; height:30px;}
  .action-icon-wrap{position:relative; display:inline-flex;}
  .card-badge{
    position:absolute; top:-3px; right:-8px;
    min-width:16px; height:16px; padding:0 4px;
    border-radius:999px;
    background:var(--accent); color:#fff;
    font-size:10px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px var(--card-bg);
  }
  .day-card.selected .card-badge{box-shadow:0 0 0 2px #dbeae9;}
  .action-btn .action-label{
    font-size:11px; font-weight:600; color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .action-btn.disabled{opacity:.35; pointer-events:none;}

  @media(min-width:720px){
    .day-card{min-height:150px;}
    .dish-name{font-size:19px; min-height:calc(19px * 1.26 * 2);}
  }

  /* ---------- Bottom Tab Bar ---------- */
  .tab-bar{
    flex-shrink:0; z-index:30;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    padding:4px 10px calc(4px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(15,23,42,0.06);
  }
  .tab-bar .tab{
    flex:1; border:none; background:none; cursor:pointer;
    padding:4px 4px 6px; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    min-height:42px;
  }
  .tab-pill{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:52px; height:26px;
    border-radius:13px;
    transition:background-color .15s ease;
  }
  .tab.active .tab-pill{background:rgba(15,118,110,0.14);}
  .tab-icon{
    width:24px; height:24px; flex-shrink:0;
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-type:alpha; mask-type:alpha;
    background-color:var(--text-muted);
    transition:background-color .15s ease;
  }
  .tab.active .tab-icon{background-color:var(--accent);}
  .tab-label{
    font-size:11px; font-weight:500; color:var(--text-muted);
    transition:color .15s ease;
  }
  .tab.active .tab-label{font-weight:800; color:var(--accent);}
  .tab-badge{
    position:absolute; top:-3px; right:-2px;
    min-width:17px; height:17px; padding:0 4px;
    border-radius:999px;
    background:var(--accent); color:#fff;
    font-size:10.5px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px #fff;
  }
  .tab-badge.hidden{display:none;}

  /* ---------- Swipeable view track ---------- */
  .view-wrap{
    flex:1 1 auto; min-height:0;
    overflow:hidden;
    position:relative;
    touch-action:pan-y;
  }
  .view-track{
    display:flex;
    width:200%;
    height:100%;
  }
  .view-panel{
    width:50%; flex-shrink:0; min-width:0;
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }

  /* ---------- Shopping list ---------- */
  .shop-hint{
    font-size:12.5px; color:var(--text-muted); background:var(--accent-lighter);
    border:1px solid var(--accent-light); border-radius:var(--radius-sm);
    padding:10px 14px; margin-bottom:16px; line-height:1.5;
  }

  /* progress indicator (Material 3 linear progress style) */
  .shop-progress-wrap{margin-bottom:18px;}
  .shop-progress-label{
    font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px;
  }
  .shop-progress-label .muted{color:var(--text-muted); font-weight:700;}
  .shop-progress-track{
    height:5px; border-radius:999px; background:var(--accent-light); overflow:hidden;
  }
  .shop-progress-fill{
    height:100%; border-radius:999px; background:var(--accent);
    width:0%; transition:width .25s ease;
  }

  /* "all done" banner */
  .shop-done-banner{
    display:flex; align-items:center; gap:8px;
    background:var(--accent-lighter); border:1px solid var(--accent-light);
    color:var(--accent-dark); font-weight:700; font-size:14px;
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px;
  }

  /* empty state */
  .shop-empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:64px 24px 40px;
  }
  .shop-empty-state img{width:72px; height:72px; margin-bottom:18px; opacity:.5;}
  .shop-empty-title{font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px;}
  .shop-empty-sub{font-size:13.5px; color:var(--text-muted); font-weight:500; max-width:260px; line-height:1.4;}

  .shop-group{margin-bottom:22px;}
  .shop-group h2{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    font-size:13px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--accent-dark); margin:0; font-weight:800;
    padding:10px 0 8px;
  }
  .shop-done-toggle{
    width:100%; display:flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    padding:9px 2px; margin:2px 0 4px;
    font-size:12.5px; font-weight:700; color:var(--text-muted);
    text-align:left;
  }
  .shop-done-toggle .chevron{
    display:inline-block; font-size:14px; line-height:1;
    transition:transform .2s ease;
  }
  .shop-done-toggle .chevron.open{transform:rotate(90deg);}
  .shop-item{
    display:flex; align-items:center; gap:12px;
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px;
    cursor:pointer; min-height:44px;
    transition:opacity .28s ease, transform .28s ease;
  }
  .shop-item.shop-item-leaving{
    opacity:0; transform:translateX(14px); pointer-events:none;
  }
  .shop-item input[type=checkbox]{
    width:20px; height:20px; accent-color:var(--accent); flex-shrink:0;
  }
  .shop-item .txt{flex:1;}
  .shop-item .name{font-size:14.5px; font-weight:600;}
  .shop-item .qty{font-size:13px; color:var(--text-muted); margin-top:1px;}
  .shop-item.checked .name, .shop-item.checked .qty{
    text-decoration:line-through; color:var(--text-faint);
  }
  .empty-msg{
    text-align:center; color:var(--text-muted); padding:40px 20px; font-size:14px;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,0.42);
    z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:#fff; width:100%; max-width:640px;
    border-radius:22px 22px 0 0;
    height:60vh;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow-sheet);
    transform:translateY(100%); transition:transform .25s ease;
    overflow:hidden;
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{
    width:40px; height:5px; background:#d7dad9; border-radius:99px;
    margin:10px auto 4px; flex-shrink:0;
  }
  .sheet-header{
    flex-shrink:0;
    padding:6px 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .sheet-title-wrap{min-width:0; flex:1;}
  .sheet-header h3{margin:0; font-size:17px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-header-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .sheet-close{
    border:none; background:var(--accent-lighter); color:var(--accent-dark);
    width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .sheet-body{flex:1; min-height:0; overflow-y:auto; padding:16px 20px 16px;}
  .sheet-swipe-footer{
    flex-shrink:0; width:100%; display:flex; align-items:center; justify-content:center; gap:12px;
    padding:10px 20px calc(12px + env(safe-area-inset-bottom));
    border:none; border-top:1px solid var(--border); background:none; cursor:pointer;
  }
  .sheet-swipe-footer:active{background:rgba(15,118,110,0.08);}
  .sheet-swipe-footer #sheet-swipe-hint{font-size:13.5px; font-weight:700; color:var(--text-muted);}
  .sheet-swipe-footer .swipe-arrow{font-size:18px; font-weight:700; color:var(--text-faint); line-height:1;}

  .portion-note{
    background:var(--accent-lighter); color:var(--accent-dark); font-size:12.5px;
    font-weight:600; line-height:1.4; padding:8px 12px; border-radius:10px; margin:0 0 12px;
  }
  .portion-note strong{font-weight:800;}

  table.macro-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.macro-table th, table.macro-table td{
    text-align:left; padding:7px 6px; border-bottom:1px solid var(--border);
  }
  table.macro-table th{color:var(--text-muted); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
  table.macro-table td.num, table.macro-table th.num{text-align:right; white-space:nowrap;}
  table.macro-table tr.sum-row td{font-weight:800; border-top:2px solid var(--accent); border-bottom:none; background:var(--accent-lighter);}
  .qty-cell{font-size:12px; color:var(--text-muted);}

  table.macro-table td.ing-check-cell, table.macro-table th.ing-check-cell{
    width:28px; padding-left:0; padding-right:0;
  }
  table.macro-table td.ing-name-cell{cursor:pointer;}
  .ing-check-circle{
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--text-faint); background:none;
    display:flex; align-items:center; justify-content:center;
    padding:0; cursor:pointer; flex-shrink:0;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .ing-check-circle.checked{
    background:var(--accent); border-color:var(--accent);
  }
  .ing-check-circle svg{width:12px; height:12px; color:#fff; display:block;}

  .recipe-list{margin:0; padding:0; list-style:none; counter-reset:step;}
  .recipe-list li{
    counter-increment:step;
    display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);
    font-size:14.5px; line-height:1.5;
  }
  .recipe-list li:last-child{border-bottom:none;}
  .recipe-list li::before{
    content:counter(step);
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<div class="app-shell">
<header class="app-header">
  <div class="app-logo-wrap">
    <img class="app-logo" src="assets/logo.png" alt="Mahlzeit – Abendessen-Planer">
  </div>
  <div class="header-actions">
    <div class="portion-stepper" id="header-portion-stepper" title="Portionen für alle Gerichte setzen">
      <svg class="portion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <button id="header-portion-minus" onclick="changeGlobalPortion(-1)" aria-label="Weniger Personen für alle Gerichte" disabled>−</button>
      <span class="portion-value" id="global-portion-value">1</span>
      <button id="header-portion-plus" onclick="changeGlobalPortion(1)" aria-label="Mehr Personen für alle Gerichte">+</button>
    </div>
    <button class="icon-btn" id="reroll-all-btn" aria-label="Alle Gerichte neu auslosen" title="Alle neu auslosen">
      <img src="" id="reroll-all-img" alt="">
    </button>
    <button class="icon-btn" id="toggle-all-btn" aria-label="Alle Tage für Einkaufsliste auswählen oder abwählen" title="Alle auswählen/abwählen">
      <img src="" id="toggle-all-img" alt="">
    </button>
  </div>
</header>

<div class="view-wrap" id="view-wrap">
  <div class="view-track" id="view-track">
    <section class="view-panel" id="dashboard-view">
      <div class="view">
        <div class="day-grid" id="day-grid"></div>
      </div>
    </section>

    <section class="view-panel" id="shopping-view">
      <div class="view">
        <div class="shop-hint">Haken bleiben nur erhalten, solange diese Seite geöffnet ist – beim Neuladen/Schließen geht der Status verloren.</div>

        <div class="shop-progress-wrap" id="shop-progress-wrap">
          <div class="shop-progress-label" id="shop-progress-label">0 von <span class="muted">0</span> offen</div>
          <div class="shop-progress-track">
            <div class="shop-progress-fill" id="shop-progress-fill"></div>
          </div>
        </div>

        <div class="shop-done-banner hidden" id="shop-done-banner">Sauber, alles besorgt - Mahlzeit!</div>

        <div class="shop-empty-state hidden" id="shopping-empty">
          <img id="shop-empty-icon" src="" alt="">
          <div class="shop-empty-title">Deine Liste ist leer.</div>
          <div class="shop-empty-sub">Wähle im Dashboard mindestens ein Gericht aus.</div>
        </div>

        <div id="shopping-groups"></div>
      </div>
    </section>
  </div>
</div>

<nav class="tab-bar">
  <button id="tab-dashboard" class="tab active" onclick="switchView('dashboard')" aria-label="Dashboard">
    <span class="tab-pill"><span class="tab-icon" id="tab-icon-dashboard"></span></span>
    <span class="tab-label">Dashboard</span>
  </button>
  <button id="tab-shopping" class="tab" onclick="switchView('shopping')" aria-label="Einkaufsliste, 0 offene Artikel">
    <span class="tab-pill">
      <span class="tab-icon" id="tab-icon-shopping"></span>
      <span class="tab-badge hidden" id="tab-badge-shopping">0</span>
    </span>
    <span class="tab-label">Einkaufsliste</span>
  </button>
</nav>
</div>

<!-- Unified detail sheet: Zutaten <-> Rezept -->
<div class="sheet-overlay" id="detail-overlay" onclick="closeSheetOnOverlay(event,'detail-overlay')">
  <div class="sheet" id="detail-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title-wrap">
        <h3 id="detail-title">Zutaten</h3>
      </div>

const DISHES = DATA.dishes;
const ING_META = DATA.meta;

const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = {mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};
const DAY_SHORT = {mon:'Mo',tue:'Di',wed:'Mi',thu:'Do',fri:'Fr',sat:'Sa',sun:'So'};

const CAT_LABELS = {
  frisch:'Frischeprodukte / Kühlung',
  trocken:'Konserven / Trocken',
  gewuerze:'Gewürze (Vorratscheck)',
  oel:'Öl',
  sonstig:'Sonstiges (Vorratscheck)'
};
const CAT_ORDER = ['frisch','trocken','gewuerze','oel','sonstig'];

const dishesById = {};
DISHES.forEach(d => dishesById[d.id] = d);

// ---------------- runtime state (memory only, no persistence) ----------------
let assignment = {};      // day -> dishId
let selected = {};        // day -> bool
let portions = {};        // day -> Personenanzahl (Standard 1)
let globalPortions = 1;   // zuletzt über den Header gesetzter Wert
let checkedShopping = new Set(); // ingredient keys checked off
let currentView = 'dashboard';
let rerollPools = {}; // day -> shuffled queue of dish ids not yet shown on THIS card since the last full cycle
const PORTIONS_MIN = 1, PORTIONS_MAX = 6;

function shuffledIds(){
  const ids = DISHES.map(d=>d.id);
  for(let i=ids.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [ids[i],ids[j]] = [ids[j],ids[i]];
  }
  return ids;
}

function initAssignment(){
  const pool = shuffledIds();
  DAYS.forEach((day,i) => {
    assignment[day] = pool[i];
    selected[day] = false;
    portions[day] = 1;
  });
}

function changePortion(day, delta){
  portions[day] = Math.min(PORTIONS_MAX, Math.max(PORTIONS_MIN, portions[day] + delta));
  renderDashboard();
  if(currentView === 'shopping') renderShoppingList();
  if(sheetDishId !== null && dayForDish(sheetDishId) === day) renderSheetContent();
}

function changeGlobalPortion(delta){
  globalPortions = Math.min(PORTIONS_MAX, Math.max(PORTIONS_MIN, globalPortions + delta));
  DAYS.forEach(d => portions[d] = globalPortions);
  updateHeaderPortionUI();
  renderDashboard();
  if(currentView === 'shopping') renderShoppingList();
  if(sheetDishId !== null) renderSheetContent();
}

function updateHeaderPortionUI(){
  document.getElementById('global-portion-value').textContent = globalPortions;
  document.getElementById('header-portion-minus').disabled = (globalPortions <= PORTIONS_MIN);
  document.getElementById('header-portion-plus').disabled = (globalPortions >= PORTIONS_MAX);
}

function dayForDish(dishId){
  return DAYS.find(d => assignment[d] === dishId);
}

// ---------------- icon helpers ----------------
function iconSrc(name){ return 'assets/icons/' + name + '.png'; }

// ---------------- rendering: dashboard ----------------
function renderDashboard(){
  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  DAYS.forEach(day => {
    const dishId = assignment[day];
    const dish = dishesById[dishId];
    const isSelected = selected[day];
    const portionCount = portions[day];
    const usedIds = new Set(Object.values(assignment));
    const availableForReroll = DISHES.filter(d => d.id !== dishId && !usedIds.has(d.id));
    const rerollDisabled = availableForReroll.length === 0;

function toggleSelected(day){

// card-specific "shuffle bag": statt bei jedem Klick rein zufällig aus dem Pool zu
// ziehen (wodurch dasselbe Gericht mehrfach erscheinen kann, bevor alle anderen
// einmal dran waren), wird pro Karte eine zufällig geordnete Warteschlange aller
// (aktuell) nicht gezeigten Gerichte abgearbeitet. Ist sie leer, wird sie neu gefüllt.
function refillRerollPool(day){
  const currentId = assignment[day];
  rerollPools[day] = shuffledIds().filter(id => id !== currentId);
}

function rerollDay(day){
  const usedElsewhere = new Set(DAYS.filter(d => d !== day).map(d => assignment[d]));

  if(!rerollPools[day] || rerollPools[day].length === 0){
    refillRerollPool(day);
  }

  let pick = null;
  for(let attempt = 0; attempt < 2 && pick === null; attempt++){
    while(rerollPools[day].length > 0){
      const candidate = rerollPools[day].shift();
      if(!usedElsewhere.has(candidate)){
        pick = candidate;
        break;
      }
      // candidate wird gerade auf einem anderen Tag gezeigt - für diesen Durchlauf verwerfen
    }
    if(pick === null){
      // Pool leer, ohne ein verfügbares Gericht gefunden zu haben - neu füllen und erneut versuchen
      refillRerollPool(day);
    }
  }
  if(pick === null) return; // wirklich kein Gericht verfügbar

  assignment[day] = pick;
  selected[day] = false;
  renderDashboard();
  if(currentView === 'shopping') renderShoppingList();
}

function toggleAllSelection(){
  const anySelected = DAYS.some(d => selected[d]);
  DAYS.forEach(d => selected[d] = !anySelected);
  // Bugfix: wird über diesen Button ALLES abgewählt, ist die Liste danach leer -
  // der "erledigt"-Status darf dann nicht an eine später neu gewählte Auswahl
  // "durchgereicht" werden (gleicher Zutaten-Key könnte sonst schon abgehakt wirken).
  if(anySelected){
    checkedShopping.clear();
    Object.keys(pendingSection).forEach(k => delete pendingSection[k]);
    Object.keys(moveTimers).forEach(k => clearMoveTimer(k));
  }
  renderDashboard();
  if(currentView === 'shopping') renderShoppingList();
}

function rerollAll(){
  const previousIds = new Set(Object.values(assignment));
  let pool = shuffledIds().filter(id => !previousIds.has(id));
  if(pool.length < DAYS.length){
    // Not enough dishes left to fully avoid repeats (only relevant if the dish
    // pool ever shrinks below 2x the number of days) - fall back to the full pool.
    pool = shuffledIds();
  }
  DAYS.forEach((day,i) => { assignment[day] = pool[i]; selected[day] = false; });
  rerollPools = {}; // Karten-spezifische Wechseln-Pools starten nach "Alle wechseln" neu
  // Analog zu "alle abwählen": nach "Alle wechseln" ist kein Tag mehr auf der
  // Einkaufsliste, der "erledigt"-Status darf nicht in die neue Auslosung durchsickern.
  checkedShopping.clear();
  Object.keys(pendingSection).forEach(k => delete pendingSection[k]);
  Object.keys(moveTimers).forEach(k => clearMoveTimer(k));
  renderDashboard();
  if(currentView === 'shopping') renderShoppingList();
}

function updateToggleAllIcon(){

function fmt(n){

function ingredientCheckCircleHtml(key, label){

  renderSheetContent();

// swipe left/right on the sheet to switch between Zutaten and Rezept
(function setupSheetSwipe(){
  const sheet = document.getElementById('detail-sheet');
  let startX = 0, startY = 0, tracking = false;
  sheet.addEventListener('touchstart', (ev) => {
    if(ev.touches.length !== 1) return;
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  sheet.addEventListener('touchend', (ev) => {
    if(!tracking) return;
    tracking = false;
    const dx = ev.changedTouches[0].clientX - startX;
    const dy = ev.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
      switchSheetTab();
    }
  }, {passive:true});
})();

// ---------------- shopping list ----------------
function displayQty(item){
  if(item.unit === 'vorrat') return 'Vorrat prüfen';
  if(item.unit === 'g'){
    const g = Math.ceil(item.sum/10)*10;
    return g + ' g' + (item.note ? ' — ' + item.note : '');
  }
  if(item.unit === 'stueck'){
    const n = Math.max(1, Math.ceil(item.sum/item.size));
    return n + ' Stück' + (item.note ? ' — ' + item.note : '');
  }
  if(item.unit === 'bund'){
    const n = Math.max(1, Math.ceil(item.sum/item.size));
    return n + ' Bund';
  }
  if(item.unit === 'zehe'){
    const n = Math.max(1, Math.ceil(item.sum/item.size));
    return n + ' Zehe(n)';
  }
  if(item.unit === 'ei'){
    const n = Math.max(1, Math.round(item.sum/item.size));
    return n + ' Stück';
  }
  return '';
}

function buildConsolidatedList(){
  const activeDays = DAYS.filter(d => selected[d]);
  const consolidated = {};
  activeDays.forEach(d => {
    const dish = dishesById[assignment[d]];
    const scale = portions[d] || 1;
    dish.ingredients.forEach(ing => {
      if(!consolidated[ing.key]){
        consolidated[ing.key] = {
          key: ing.key, label: ing.label, cat: ing.cat, unit: ing.unit,
          size: ing.size, note: ing.note, sum: 0
        };
      }
      consolidated[ing.key].sum += (ing.unit === 'vorrat' ? 0 : ing.grams*scale);
    });
  });
  return consolidated;
}

// which section (open / done) an item currently renders under. Normally mirrors
// checkedShopping, but during the brief post-toggle delay it holds the item at
// its PREVIOUS section so the move can be seen and animated (see toggleChecked).
let pendingSection = {};
// per-category collapsed/expanded state of the "Erledigt (n)" sub-section. Undefined = collapsed (default).
let doneExpanded = {};
let moveTimers = {}; // key -> {outer, inner} timeout ids, so rapid re-toggling cancels cleanly
// Zustand für die "Liste ist leer, aber es gibt erledigte Zutaten aus vorheriger Auswahl"-Ansicht:
let shoppingWasEmpty = false;   // true, solange die letzte Render-Runde total===0 war (löst Reset beim Verlassen aus)
let leftoverSuppressed = false; // wird true, sobald in der leeren Ansicht eine Zutat "unerledigt" wird -> alle einklappen

function effectiveSection(key){
  if(pendingSection[key]) return pendingSection[key];
  return checkedShopping.has(key) ? 'done' : 'open';
}

function shopItemHtml(item){
  const checked = checkedShopping.has(item.key);
  return `
    <div class="shop-item ${checked?'checked':''}" data-key="${item.key}" onclick="toggleChecked('${item.key}')">
      <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation(); toggleChecked('${item.key}')">
      <div class="txt">
        <div class="name">${item.label}</div>
        <div class="qty">${displayQty(item)}</div>
      </div>
    </div>`;
}

// Erledigte Zutaten aus Gerichten, die aktuell NICHT ausgewählt sind (z.B. weil das
// Gericht nach dem Abhaken wieder abgewählt wurde). Menge lässt sich ohne aktives
// Gericht/Portionen nicht mehr sinnvoll berechnen, daher nur Name + Hinweistext.
function buildLeftoverDoneItems(){
  const out = [];
  checkedShopping.forEach(key => {
    const meta = ING_META[key];
    if(!meta) return;
    out.push({ key, label: meta[0], cat: meta[1] });
  });
  return out;
}

function leftoverItemHtml(item){
  return `
    <div class="shop-item checked" data-key="${item.key}" onclick="toggleChecked('${item.key}')">
      <input type="checkbox" checked onclick="event.stopPropagation(); toggleChecked('${item.key}')">
      <div class="txt">
        <div class="name">${item.label}</div>
        <div class="qty">Aktuell kein Gericht dafür ausgewählt</div>
      </div>
    </div>`;
}

function renderShopProgress(total, openCount){
  const doneCount = total - openCount;
  const pct = total > 0 ? Math.round((doneCount/total)*100) : 0;
  document.getElementById('shop-progress-label').innerHTML =
    openCount + ' von <span class="muted">' + total + '</span> offen';
  document.getElementById('shop-progress-fill').style.width = pct + '%';
}

function renderShoppingList(){
  const consolidated = buildConsolidatedList();
  const items = Object.values(consolidated);
  const total = items.length;
  const openCount = items.filter(i => !checkedShopping.has(i.key)).length;

  updateShoppingTabIndicator();

  const progressWrap = document.getElementById('shop-progress-wrap');
  const bannerEl = document.getElementById('shop-done-banner');
  const emptyEl = document.getElementById('shopping-empty');
  const groupsContainer = document.getElementById('shopping-groups');

  // Teil D, Punkt 12: Liste komplett leer -> Vollbild-Empty-State, Fortschritt ausgeblendet.
  if(total === 0){
    progressWrap.classList.add('hidden');
    bannerEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    shoppingWasEmpty = true;

    // Sonderfall: kein Gericht ausgewählt, aber es gibt noch erledigte Zutaten aus
    // einer vorherigen Auswahl -> darunter ausgeklappt je Kategorie auflisten.
    const leftoverItems = leftoverSuppressed ? [] : buildLeftoverDoneItems();
    if(leftoverItems.length > 0){
      groupsContainer.classList.remove('hidden');
      let leftoverHtml = '';
      CAT_ORDER.forEach(cat => {
        const catItems = leftoverItems.filter(i => i.cat === cat).sort((a,b) => a.label.localeCompare(b.label,'de'));
        if(catItems.length === 0) return;
        leftoverHtml += `<div class="shop-group">`;
        leftoverHtml += `<h2>${CAT_LABELS[cat]} · ${catItems.length} Artikel</h2>`;
        catItems.forEach(item => { leftoverHtml += leftoverItemHtml(item); });
        leftoverHtml += `</div>`;
      });
      groupsContainer.innerHTML = leftoverHtml;
    } else {
      groupsContainer.classList.add('hidden');
      groupsContainer.innerHTML = '';
    }
    return;
  }

  // Verlassen der Leer-Ansicht (wieder mind. ein Gericht ausgewählt, es gibt also
  // wieder "unerledigte" Zutaten) -> alle Erledigt-Bereiche/den Sonderfall zurücksetzen.
  if(shoppingWasEmpty){
    doneExpanded = {};
    leftoverSuppressed = false;
    shoppingWasEmpty = false;
  }

  emptyEl.classList.add('hidden');
  groupsContainer.classList.remove('hidden');
  progressWrap.classList.remove('hidden');
  renderShopProgress(total, openCount);

  // Teil D, Punkt 13: alles abgehakt -> Banner, Liste bleibt sichtbar.
  bannerEl.classList.toggle('hidden', openCount !== 0);

  let html = '';
  CAT_ORDER.forEach(cat => {
    const groupItems = items.filter(i => i.cat === cat).sort((a,b) => a.label.localeCompare(b.label,'de'));
    if(groupItems.length === 0) return;
    const openItems = groupItems.filter(i => effectiveSection(i.key) === 'open');
    const doneItems = groupItems.filter(i => effectiveSection(i.key) === 'done');
    const expanded = !!doneExpanded[cat];

    html += `<div class="shop-group">`;
    html += `<h2>${CAT_LABELS[cat]} · ${groupItems.length} Artikel</h2>`;
    openItems.forEach(item => { html += shopItemHtml(item); });
    if(doneItems.length > 0){
      html += `
        <button type="button" class="shop-done-toggle" onclick="toggleDoneExpanded('${cat}')" aria-expanded="${expanded}">
          <span class="chevron ${expanded?'open':''}" aria-hidden="true">›</span>
          <span>Erledigt (${doneItems.length})</span>
        </button>`;
      if(expanded){
        doneItems.forEach(item => { html += shopItemHtml(item); });
      }
    }
    html += `</div>`;
  });
  groupsContainer.innerHTML = html;
}

function toggleDoneExpanded(cat){
  doneExpanded[cat] = !doneExpanded[cat];
  renderShoppingList();
}

function clearMoveTimer(key){
  const t = moveTimers[key];
  if(t){
    if(t.outer) clearTimeout(t.outer);
    if(t.inner) clearTimeout(t.inner);
    delete moveTimers[key];
  }
}

function toggleChecked(key){
  const wasChecked = checkedShopping.has(key);
  // Wird eine Zutat "unerledigt", während gerade kein Gericht ausgewählt ist (also
  // in der Leer-Ansicht mit erledigten Restzutaten): alle erledigten Kategorien
  // dort sofort einklappen, nicht nur diese eine Zutat entfernen.
  if(wasChecked && Object.keys(buildConsolidatedList()).length === 0){
    leftoverSuppressed = true;
  }
  if(wasChecked) checkedShopping.delete(key);
  else checkedShopping.add(key);

  // Teil B, Punkt 5+7: Artikel bleibt kurz an alter Position sichtbar, bevor er
  // (fade + slide) in seinen neuen Bereich wandert.
  pendingSection[key] = wasChecked ? 'done' : 'open';
  clearMoveTimer(key);

  const timer = {outer:null, inner:null};
  timer.outer = setTimeout(() => {
    const el = document.querySelector('.shop-item[data-key="' + key + '"]');
    if(el){
      el.classList.add('shop-item-leaving');
      timer.inner = setTimeout(() => {
        delete pendingSection[key];
        delete moveTimers[key];
        renderShoppingList();
      }, 280);
    } else {
      delete pendingSection[key];
      delete moveTimers[key];
      renderShoppingList();
    }
  }, 650);
  moveTimers[key] = timer;

  renderShoppingList();
  renderDashboard();
}

// ---------------- shopping tab indicator (single source of truth) ----------------
function openArticleCount(){
  const consolidated = buildConsolidatedList();
  return Object.keys(consolidated).filter(k => !checkedShopping.has(k)).length;
}

// per-dish: how many of this dish's ingredients are on the shopping list and not yet checked off.
// null = dish is not on the shopping list at all (no badge shown).
function dishOpenIngredientCount(day){
  if(!selected[day]) return null;
  const dish = dishesById[assignment[day]];
  const keys = new Set(dish.ingredients.map(ing => ing.key));
  let count = 0;
  keys.forEach(k => { if(!checkedShopping.has(k)) count++; });
  return count;
}

// per-dish: how many distinct ingredients are still OPEN (not already checked off)
// for this recipe - shown on the "Zutaten" button only while the dish is NOT on the
// shopping list (once it is, the "Liste" button already covers the open-count context).
function dishIngredientTotalCount(day){
  if(selected[day]) return null;
  const dish = dishesById[assignment[day]];
  const keys = new Set(dish.ingredients.map(ing => ing.key));
  let count = 0;
  keys.forEach(k => { if(!checkedShopping.has(k)) count++; });
  return count > 0 ? count : null;
}

function setMaskIcon(el, name){
  const url = "url('" + iconSrc(name) + "')";
  el.style.webkitMaskImage = url;
  el.style.maskImage = url;
}

function updateShoppingTabIndicator(){
  const count = openArticleCount();
  const hasOpen = count > 0;
  setMaskIcon(document.getElementById('tab-icon-shopping'), hasOpen ? 'icon-einkaufsliste-aktiv' : 'icon-einkaufsliste-inaktiv');
  const badge = document.getElementById('tab-badge-shopping');
  badge.textContent = count;
  badge.classList.toggle('hidden', count === 0);
  document.getElementById('tab-shopping').setAttribute('aria-label', 'Einkaufsliste, ' + count + ' offene Artikel');
}

// ---------------- view switching (tab click + swipe share this) ----------------
const SCREENS = ['dashboard', 'shopping'];
let currentScreenIndex = 0;

function setTrackPct(pct, animate){
  const track = document.getElementById('view-track');
  track.style.transition = animate ? 'transform .3s cubic-bezier(0.22,0.61,0.36,1)' : 'none';
  track.style.transform = 'translateX(' + pct + '%)';
}

function updateTabBarActive(){
  document.getElementById('tab-dashboard').classList.toggle('active', currentView === 'dashboard');
  document.getElementById('tab-shopping').classList.toggle('active', currentView === 'shopping');
}

function applyScreen(index, animate){
  currentScreenIndex = index;
  currentView = SCREENS[index];
  setTrackPct(-index * 50, animate !== false);
  updateTabBarActive();
  if(currentView === 'shopping') renderShoppingList();
}

function switchView(view){
  const index = SCREENS.indexOf(view);
  if(index === -1 || index === currentScreenIndex) { applyScreen(index === -1 ? currentScreenIndex : index, true); return; }
  applyScreen(index, true);
}

// ---------------- swipe navigation between Dashboard <-> Einkaufsliste ----------------
(function setupSwipeNav(){
  const wrap = document.getElementById('view-wrap');
  const track = document.getElementById('view-track');
  let dragging = false, axisLocked = null;
  let startX = 0, startY = 0, widthPx = 0, lastDx = 0;

  function rubberBand(dx, w){
    const c = w * 0.55;
    const abs = Math.abs(dx);
    const damped = c * abs / (c + abs);
    return dx < 0 ? -damped : damped;
  }

  function onDown(ev){
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    dragging = true; axisLocked = null; lastDx = 0;
    startX = ev.clientX; startY = ev.clientY;
    widthPx = wrap.getBoundingClientRect().width;
  }
  function onMove(ev){
    if(!dragging) return;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if(axisLocked === null){
      // Echte Finger-Gesten starten selten perfekt geradlinig (Zittern/Ungenauigkeit).
      // Erst ab einer klaren Distanz UND einem klaren Übergewicht einer Achse entscheiden,
      // sonst wird eine leicht "krumm" begonnene horizontale Wischgeste fälschlich als
      // vertikales Scrollen gewertet und nie mehr reaktiviert (Bug: Swipe ging am
      // Desktop/Maus, aber nicht auf echten Touch-Geräten).
      const adx = Math.abs(dx), ady = Math.abs(dy);
      const dist = Math.max(adx, ady);
      if(dist < 10) return; // zu wenig Bewegung, um die Richtung schon zu beurteilen
      if(adx > ady * 1.3){
        axisLocked = 'x';
      } else if(ady > adx * 1.3){
        axisLocked = 'y';
        dragging = false;
        return;
      } else if(dist > 40){
        // nach längerer Strecke immer noch uneindeutig - jetzt erzwungen entscheiden,
        // statt die Geste unbegrenzt in der Schwebe zu lassen
        axisLocked = adx >= ady ? 'x' : 'y';
        if(axisLocked === 'y'){ dragging = false; return; }
      } else {
        return; // weiter abwarten, noch keine klare Richtung erkennbar
      }
      try{ wrap.setPointerCapture(ev.pointerId); }catch(e){}
    }
    if(axisLocked !== 'x') return;
    ev.preventDefault();
    let effDx = dx;
    const overLeft = currentScreenIndex === 0 && dx > 0;
    const overRight = currentScreenIndex === SCREENS.length - 1 && dx < 0;
    if(overLeft || overRight) effDx = rubberBand(dx, widthPx);
    lastDx = effDx;
    const basePct = -currentScreenIndex * 50;
    const deltaPct = (effDx / widthPx) * 50;
    setTrackPct(basePct + deltaPct, false);
  }
  function onUp(ev){
    if(!dragging) return;
    dragging = false;
    if(axisLocked !== 'x'){ axisLocked = null; return; }
    axisLocked = null;
    const threshold = widthPx * 0.2;
    let newIndex = currentScreenIndex;
    if(lastDx <= -threshold && currentScreenIndex < SCREENS.length - 1) newIndex = currentScreenIndex + 1;
    else if(lastDx >= threshold && currentScreenIndex > 0) newIndex = currentScreenIndex - 1;
    applyScreen(newIndex, true);
  }
  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerup', onUp);
  wrap.addEventListener('pointercancel', onUp);
})();

document.getElementById('toggle-all-btn').addEventListener('click', toggleAllSelection);
document.getElementById('reroll-all-btn').addEventListener('click', rerollAll);

// ---------------- persistence ----------------
const STORAGE_KEY = 'mahlzeit-state-v1';
let _saveTimer = null;
function saveState(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        v: 1,
        assignment, selected, portions, globalPortions,
        checkedShopping: Array.from(checkedShopping),
        rerollPools, pendingSection
      }));
    } catch(e){}
  }, 150);
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || s.v !== 1) return false;
    const validIds = new Set(DISHES.map(d => d.id));
    const cleanAssign = {};
    DAYS.forEach(day => {
      const id = s.assignment && s.assignment[day];
      if(id && validIds.has(id)) cleanAssign[day] = id;
    });
    if(Object.keys(cleanAssign).length !== DAYS.length) return false;
    assignment = cleanAssign;
    selected = {};
    portions = {};
    DAYS.forEach(day => {
      selected[day] = !!(s.selected && s.selected[day]);
      const p = s.portions && s.portions[day];
      portions[day] = (typeof p === 'number' && p >= PORTIONS_MIN && p <= PORTIONS_MAX) ? p : 1;
    });
    if(typeof s.globalPortions === 'number' && s.globalPortions >= PORTIONS_MIN && s.globalPortions <= PORTIONS_MAX){
      globalPortions = s.globalPortions;
    }
    if(Array.isArray(s.checkedShopping)) checkedShopping = new Set(s.checkedShopping);
    if(s.rerollPools && typeof s.rerollPools === 'object') rerollPools = s.rerollPools;
    if(s.pendingSection && typeof s.pendingSection === 'object') pendingSection = s.pendingSection;
    return true;
  } catch(e){ return false; }
}
['changePortion','changeGlobalPortion','toggleSelected','rerollDay','toggleAllSelection','rerollAll','toggleIngredientChecked'].forEach(name => {
  const orig = window[name];
  if(typeof orig === 'function'){
    window[name] = function(){ const r = orig.apply(this, arguments); saveState(); return r; };
  }
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveState(); });
window.addEventListener('pagehide', saveState);

// ---------------- init ----------------
if(!loadState()){ initAssignment(); saveState(); }
updateHeaderPortionUI();
document.getElementById('reroll-all-img').src = iconSrc('icon-auslosen');
document.getElementById('shop-empty-icon').src = iconSrc('icon-einkaufsliste-inaktiv');
setMaskIcon(document.getElementById('tab-icon-dashboard'), 'icon-dashboard');
renderDashboard();
applyScreen(0, false);
</script>
